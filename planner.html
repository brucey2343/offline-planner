/* Task status hierarchy: readable at small screen sizes and on paper. */
.task-item{position:relative;border-left:4px solid #bccbde;transition:background .12s}
.task-item.task-high{background:#fff;border-left-color:#3e55a4}
.task-item.task-high:not(.done) .task-text{font-weight:790}
.task-item.task-low{background:#f5f7fb;border-left-color:#8292a6}
.task-item.task-overdue{background:#fff1f0;border-left-color:#c42d38;box-shadow:inset 0 0 0 1px #ffd2cf}
.task-item.task-overdue.task-high{background:#fff1f0;border-left-color:#b72e35}
.task-item.done{background:#f2f5f9;border-left-color:#b6becb;box-shadow:none;opacity:.80}
.task-item .task-status{display:flex;gap:5px;flex-wrap:wrap;margin:1px 0 5px}
.task-item .task-status .badgetext{font-weight:780;letter-spacing:.01em}
.task-item .task-status .status-overdue{background:#bd343d;color:white}
.task-item .task-status .status-high{background:#273e75;color:white}
.task-item .task-status .status-low{background:#dcefee;color:#1d5a62}
.task-order-controls{display:inline-flex;gap:2px;align-items:center}
.task-order-controls .ghost{font-size:17px;min-width:34px;min-height:34px;border:1px solid #d3dfed;background:#f8faff}
.task-order-controls .ghost:disabled{opacity:.32}
.plan-sort-label{display:inline-flex;align-items:center;gap:7px;font-weight:690;font-size:.85rem}
.plan-sort-label select,.print-sort-label select{padding:8px 10px;border:1px solid #cbd7e7;border-radius:8px;background:white;color:#203b60;max-width:260px}
.print-sort-label{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;font-weight:680;font-size:.85rem;margin:8px 0}
.month-day .cal-task.high{font-weight:800;outline:1px solid #778cc1;background:white;color:#1a3568}
.month-day .cal-task.low{background:#edf6f5;color:#245d62;border-left:2px dotted #39777e}
.month-day .cal-task.overdue:not(.done){border-left:3px solid #c42d38}
.paper-line.high{font-weight:800;background:white;border-left:3px double #253d70;padding-left:4px}
.paper-line.overdue{background:#fff0ee;border-left:3px solid #bd3942;padding-left:4px}
.paper-line.overdue.high{background:#fff0ee}
.paper-line .line-flag{font-size:.88em;font-weight:790;margin-right:4px;white-space:nowrap}
.paper-line .line-flag.overdue{color:#9c2634}
.paper-line .line-flag.high{color:#263f75}
.print-calendar-entry.high{font-weight:800;background:white;border-left:2px solid #273f76;padding-left:2px}.print-calendar-entry.low{border-left:2px dotted #39777e;padding-left:2px;color:#245d62}.print-calendar-legend{text-align:center;font-size:9px;font-weight:750;color:#324259}.print-calendar-entry.overdue{border-left:2px solid #c42d38;padding-left:2px}
.paper-line.done{opacity:.75;background:#f5f5f6;border-left-color:#b4bdc8}

/* Nested Daily focus groups, rendered within each existing custom A4 section. */
.task-group{border:1px solid #d7e1ed;border-radius:10px;background:#f8fafd;overflow:hidden;margin-bottom:9px}
.task-group:last-child{margin-bottom:0}
.task-group.is-empty .task-group-header{border-bottom:0;padding-top:6px;padding-bottom:6px}
.task-group-header{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:790;font-size:.83rem;padding:8px 10px;background:#edf2f8;border-bottom:1px solid #d7e1ed}
.task-group-count{font-size:.74rem;font-weight:650;color:#51617a;border-radius:12px;background:white;padding:1px 7px}

 </main>

<input id="file-import" type="file" accept=".txt,.json,.backup,application/json,text/plain" hidden>
<div id="modal-layer"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="print-root" class="print-root" aria-hidden="true"></div>
<script>
'use strict';
/* Offline Planner: standalone, dependency-free, portable. */
const storage=(()=>{try{return window.localStorage}catch(e){return {getItem:()=>null,setItem:()=>{throw e},removeItem:()=>{throw e}}}})();
const APP_VERSION=1, KEY='WORK_LIFE_OFFLINE_PLANNER_V1', LEGACY_KEY='MODULAR_A4_PLANNER_STATE_V4';
const VIEW_NAMES={daily:'Daily',backlog:'Projects & Someday',weekly:'Weekly',monthly:'Monthly',anytime:'Anytime'};
const TOTAL_COLS=12,TOTAL_ROWS=24;
const now=()=>new Date().toISOString();
const randomId=()=>globalThis.crypto?.randomUUID?.() || ('r'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isoDate=(date=new Date())=>{const d=new Date(date.getTime()-date.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)};
function parseDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3]?d:null}
function addDays(date,n){const d=parseDate(date);if(!d)return date;d.setDate(d.getDate()+n);return isoDate(d)}
function monday(date){const d=parseDate(date)||new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return isoDate(d)}
const monthOf=d=>(d||isoDate()).slice(0,7);
const readableDate=(date,options={weekday:'short',day:'numeric',month:'short'})=>parseDate(date)?.toLocaleDateString('en-GB',options)||date;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const deepClone=o=>JSON.parse(JSON.stringify(o));
const uid=(prefix='t')=>prefix+'-'+randomId();
const typeNames={tasks:'Task list',notes:'Notes / scratchpad',radar:'Monthly deadline feed',weekdays:'Seven-day schedule'};
const TASK_CATEGORIES=[['Work','daily-work'],['Personal','daily-personal'],['Appt','daily-appts'],['Waiting','daily-waiting'],['Non-negotiable','daily-nonneg']];
function dailySectionFor(task){const explicit=g(task,'dailySection','');if(explicit&&g(moduleById(explicit),'view')==='daily'&&g(moduleById(explicit),'type')==='tasks')return explicit;const original=g(task,'section','');if(original.startsWith('daily-')&&g(moduleById(original),'view')==='daily'&&g(moduleById(original),'type')==='tasks')return original;return TASK_CATEGORIES.find(pair=>pair[0]===g(task,'category','Work'))?.[1]||'daily-work'}
function categoryForDailySection(section){if(section==='daily-personal-extra')return 'Personal';return TASK_CATEGORIES.find(pair=>pair[1]===section)?.[0]||'Work'}

const DEFAULT_MODULES={
 daily:[
  ['daily-radar','Outstanding tasks overview','radar',0,0,12,3,1],
  ['daily-nonneg','Non-negotiables','tasks',0,3,12,3,1],
  ['daily-work','Work','tasks',0,6,8,12,1],
  ['daily-waiting','Waiting on / chasing','tasks',0,18,8,6,1],
  ['daily-appts','Appointments','tasks',8,6,4,5,1],
  ['daily-personal','Personal','tasks',8,11,4,6,1],
  ['daily-scratch','Scratchpad','notes',8,17,4,7,1],
  ['daily-work-notes','Extended work notes & calculations','notes',0,0,8,24,2],
  ['daily-personal-extra','Personal (continued)','tasks',8,0,4,9,2],
  ['daily-scratch-extra','Extended scratchpad','notes',8,9,4,15,2]
 ],
 backlog:[
  ['backlog-work','Work','tasks',0,0,6,12,1],['backlog-home','Home','tasks',6,0,6,12,1],
  ['backlog-tech','Tech','tasks',0,12,6,12,1],['backlog-someday','Low-energy / someday','tasks',6,12,6,12,1],
  ['backlog-work-extra','Work (continued)','tasks',0,0,6,12,2],['backlog-home-extra','Home (continued)','tasks',6,0,6,12,2],
  ['backlog-tech-extra','Tech (continued)','tasks',0,12,6,12,2],['backlog-someday-extra','Low-energy / someday (continued)','tasks',6,12,6,12,2]
 ],
 weekly:[
  ['weekly-radar','Outstanding tasks overview','radar',0,0,12,4,1],
  ['weekly-days','Monday – Sunday','weekdays',0,4,8,20,1],
  ['weekly-priorities',"This week's priorities",'tasks',8,4,4,10,1],
  ['weekly-scratch','Scratchpad','notes',8,14,4,10,1],
  ['weekly-notes-extra','Extended weekly tasks & notes','notes',0,0,8,24,2],['weekly-scratch-extra','Extended scratchpad','notes',8,0,4,24,2]
 ],
 monthly:[
  ['monthly-radar','Dated deadlines, events & radar','tasks',0,0,12,10,1],
  ['monthly-work-focus','Monthly work focus','notes',0,10,6,14,1],
  ['monthly-personal-focus','Monthly personal & home focus','notes',6,10,6,14,1],
  ['monthly-radar-extra','Additional dated radar items','tasks',0,0,12,10,2],
  ['monthly-scratch-extra','Extended monthly planning & scratchpad','notes',0,10,12,14,2]
 ],
 anytime:[
  ['anytime-list','Tasks without due dates','tasks',0,0,12,18,1],
  ['anytime-notes','Anytime notes','notes',0,18,12,6,1]
 ]};
const PAGE_ACTIVE_DEFAULT={daily:[1],backlog:[1],weekly:[1],monthly:[1],anytime:[1]};
const collapsedSubtasks=new Set(),openEmptySubtasks=new Set(),quickAddPresets=new Map();
let store,deviceId,seq=0,active='daily',mode='plan',focusDates={daily:isoDate(),weekly:monday(isoDate()),monthly:monthOf(isoDate())},selectedModule=null,batchMode=false,batchSelected=new Map(),lastImportSummary=null,drawPending=false,storageOkay=true,storageError='',storageRecoveryRequired=false,damagedRaw=null,conflicts=[],unresolvedCount=0;
function newStore(){return {format:'work-life-planner',schema:1,createdAt:now(),records:{},prefs:{showRules:true,showDone:true,showOverdue:true,showCalendar:true,sortMode:'focus',printSortMode:'focus',overdueOnly:false,pages:deepClone(PAGE_ACTIVE_DEFAULT),active:'daily'},exportedAt:null}}
function blankRevision(value){return {value,rev:uid('baseline'),anc:[]}}
function ensureSharedSettings(){const id='shared-settings',defaults={showRules:true,showDone:true,showOverdue:true,showCalendar:true};if(!store.records[id]){const record={id,kind:'settings',fields:{}};for(const [key,def] of Object.entries(defaults)){const value=store.prefs[key]??def,base=`default-v1:${id}:${key}`;record.fields[key]=value===def?{value,rev:base,anc:[]}:{value,rev:`${deviceId}:${++seq}:${Date.now()}`,anc:[base]}}store.records[id]=record}syncSharedPrefs()}
function syncSharedPrefs(){const rec=store.records['shared-settings'];if(!rec)return;for(const k of ['showRules','showDone','showOverdue','showCalendar'])store.prefs[k]=g(rec,k,store.prefs[k])}
function setPreference(key,value){setField(store.records['shared-settings'],key,value);store.prefs[key]=value;scheduleSave()}
function ensureDefaultModules(){for(const view of Object.keys(DEFAULT_MODULES)){for(const spec of DEFAULT_MODULES[view]){const [id,title,type,x,y,w,h,page]=spec;if(!store.records[id]){const obj={id,kind:'module',fields:{}};for(const [key,val] of Object.entries({view,title,type,x,y,w,h,page,hidden:false}))obj.fields[key]={value:val,rev:`default-v1:${id}:${key}`,anc:[]};store.records[id]=obj;}}}}
function g(record,field,fallback=''){return record?.fields?.[field]?.value??fallback}
function setField(record,key,value){if(!record)return false;const old=record.fields[key];if(old&&JSON.stringify(old.value)===JSON.stringify(value))return false;const rev=`${deviceId}:${++seq}:${Date.now()}`;record.fields[key]={value,rev,anc:old?[...new Set([old.rev,...(old.anc||[]).slice(0,239),...(old.anc?.length?[old.anc[old.anc.length-1]]:[])])].slice(0,241):[]};scheduleSave();return true}
function createRecord(kind,data,id=uid(kind[0])){const record={id,kind,fields:{}};for(const [key,val] of Object.entries(data))record.fields[key]={value:val,rev:`${deviceId}:${++seq}:${Date.now()}`,anc:[]};store.records[id]=record;scheduleSave();return record}
function items(kind){return Object.values(store.records).filter(x=>x.kind===kind&&!g(x,'deleted',false))}
function modulesFor(view,page=null){return items('module').filter(m=>g(m,'view')===view&&!g(m,'hidden',false)&&(page===null||g(m,'page')===page)).sort((a,b)=>g(a,'page')-g(b,'page')||g(a,'y')-g(b,'y')||g(a,'x')-g(b,'x'))}
function scopeFor(view,moduleId){if(moduleId==='weekly-days')return focusDates.weekly;return view==='daily'?focusDates.daily:view==='weekly'?focusDates.weekly:view==='monthly'?focusDates.monthly:'all'}
function moduleById(id){return store.records[id]}
function tasksFor(section,scope){return items('task').filter(t=>g(t,'section')===section&&g(t,'scope')===scope).sort((a,b)=>g(a,'order',0)-g(b,'order',0)||g(a,'created','').localeCompare(g(b,'created','')))}
/* Compatibility repair for copies made by the old Carry Forward button.
   Each copy carries a precise link to its source; NEVER dedupe on task text. */
function carrySourceId(task){const source=g(task,'carryFrom','');const match=/^(.+):\d{4}-\d{2}-\d{2}:\d{4}-\d{2}-\d{2}$/.exec(source);return match?.[1]||''}
function carryRootId(task){let id=task.id;const seen=new Set();while(!seen.has(id)){seen.add(id);const parent=store.records[id];if(!parent||parent.kind!=='task')break;const source=carrySourceId(parent);if(!source||!store.records[source]||store.records[source].kind!=='task')break;id=source}return id}
function consolidateOldCarriedTasks(){
 const groups=new Map();
 for(const task of Object.values(store.records)){
   if(task.kind!=='task'||g(task,'supersededBy',''))continue;
   const root=carryRootId(task),arr=groups.get(root)||[];arr.push(task);groups.set(root,arr)
 }
 let consolidated=0;
 for(const [rootId,group] of groups){
   if(group.length<2||!group.some(carrySourceId))continue;
   const first=store.records[rootId];if(!first)continue;
   const live=group.filter(t=>!g(t,'deleted',false));
   if(!live.length)continue;
   const root=!g(first,'deleted',false)?first:live[0];
   const descendants=live.filter(t=>t.id!==root.id);
   if(!descendants.length){if(taskDate(first)&&taskDate(root)!==taskDate(first))setField(root,'due',taskDate(first));continue;}
   // The most recently scheduled copy carries the latest unchecked checklist state.
   descendants.sort((a,b)=>{
     const aKey=(g(a,'carryFrom','').split(':').at(-1)||taskDate(a))+'|'+g(a,'created','');
     const bKey=(g(b,'carryFrom','').split(':').at(-1)||taskDate(b))+'|'+g(b,'created','');
     return aKey.localeCompare(bKey)
   });
   const latest=descendants[descendants.length-1];
   const originalDate=taskDate(first); // ALWAYS retain the original due date, not a rollover destination.
   for(const field of ['text','done','priority','category','dailySection']){
     if(latest.fields[field])setField(root,field,g(latest,field));
   }
   if(originalDate&&g(root,'due','')!==originalDate)setField(root,'due',originalDate);
   const originals=subtasksFor(root);
   // Old copies contained only unfinished steps. Incorporate *every* later copy,
   // not just the last one, so an intermediate day's completed steps are not lost.
   for(const copy of descendants){
     const used=new Set();
     for(const step of subtasksFor(copy)){
       const key=g(step,'text','').trim().toLocaleLowerCase();
       const prior=originals.find(x=>!used.has(x.id)&&g(x,'text','').trim().toLocaleLowerCase()===key);
       if(prior){used.add(prior.id);if(g(step,'done',false))setField(prior,'done',true)}
       else {setField(step,'parentId',root.id);originals.push(step);used.add(step.id)}
     }
   }
   for(const copy of descendants){setField(copy,'deleted',true);setField(copy,'supersededBy',root.id);consolidated++}
 }
 return consolidated;
}

function noteId(moduleId,scope){return 'note:'+moduleId+':'+scope}
function getNote(moduleId,scope){return g(store.records[noteId(moduleId,scope)],'text','')}
function saveNote(moduleId,scope,text){const id=noteId(moduleId,scope);let n=store.records[id];if(!n)n=createRecord('note',{module:moduleId,scope,text},id);else setField(n,'text',text)}
function newTask(section,scope,text='',extra={}){const order=Date.now();return createRecord('task',{section,scope,text,done:false,priority:'normal',energy:'standard',due:'',category:'Work',recurrence:'none',startDate:scope?.length===10?scope:'',created:now(),updated:now(),order,deleted:false,...extra})}
// Each subtask is a separate revision-tracked record linked by a stable parent task ID.
// For repeating parent tasks, completion is stored separately for each occurrence date.
function subtasksFor(task){return items('subtask').filter(child=>g(child,'parentId')===task.id).sort((a,b)=>g(a,'order',0)-g(b,'order',0)||g(a,'created','').localeCompare(g(b,'created',''))||a.id.localeCompare(b.id))}
function subtaskOccurrenceId(step,date){return 'subocc:'+step.id+':'+date}
function subtaskDone(step,parent,date=null){if(date&&g(parent,'recurrence','none')!=='none')return g(store.records[subtaskOccurrenceId(step,date)],'done',false);return g(step,'done',false)}
function setSubtaskDone(step,parent,date,value){if(date&&g(parent,'recurrence','none')!=='none'){const id=subtaskOccurrenceId(step,date);let rec=store.records[id];if(!rec)rec=createRecord('suboccurrence',{subtask:step.id,date,done:value},id);else setField(rec,'done',value)}else setField(step,'done',value)}

// A recurring job is one actionable job, not an infinite backlog of missed copies.
// Individual occurrence checkmarks remain in history.  The resolution cursor says
// which past scheduled occurrences have been dealt with, without changing due dates.

 // completed occurrence becomes our starting point. Old unchecked days don't pile up.

   if(id.startsWith(prefix)&&record.kind==='occurrence'&&g(record,'done',false)){
     const day=id.slice(prefix.length);if(parseDate(day)&&day>latest)latest=day;

// Central date resolution: due date wins; undated daily and weekday entries inherit their original day.
// Backlog, generic Weekly priorities and generic Monthly sections remain unscheduled until dated.

function datedTasksOn(date){const results=[];for(const task of items('task')){if(g(task,'recurrence','none')!=='none'){if(recurrenceMatches(task,date))results.push({task,day:date,repeat:true});continue}if(taskDate(task)===date)results.push({task,day:null})}return results.sort((a,b)=>g(a.task,'order',0)-g(b.task,'order',0)||g(a.task,'text','').localeCompare(g(b.task,'text','')))}
// A dated unfinished job follows the selected Daily date until completion.
// Recurrent jobs are different: a missed daily/weekly occurrence must not generate
// another overdue task for every day or week. Only ONE unresolved instance per
// recurring job is presented; its original recurrence and all subtasks are retained.
function firstPendingRecurringDay(task,date){

 if(!parseDate(start)||start>date)return '';

 // Handle far-future dates without creating thousands of individual records.

function firstUpcomingRecurringDay(task,date){

function outstandingTasksThrough(date){

   if(g(task,'recurrence','none')!=='none'){
     const pending=firstPendingRecurringDay(task,date);
     if(pending){results.push({task,day:pending,repeat:true,overdue:pending<date});}
     else if(recurrenceMatches(task,date)&&doneFor(task,date)){
       // Completed occurrence is retained on its own day if Show completed is on.
       results.push({task,day:date,repeat:true,overdue:false});
     }else{
       const upcoming=firstUpcomingRecurringDay(task,date);
       if(upcoming)results.push({task,day:upcoming,repeat:true,overdue:false,upcoming:true});
     }
     continue;
   }
   const originalDate=taskDate(task);
   if(originalDate&&originalDate<=date&&(originalDate===date||!doneFor(task))){
     results.push({task,day:null,overdue:originalDate<date});
   }else if(originalDate&&originalDate>date&&originalDate<=addDays(date,7)&&!doneFor(task)){
     results.push({task,day:null,overdue:false,upcoming:true});

const SORT_OPTIONS=[['focus','Focus: overdue → priority → due date'],['due','Due date: earliest first'],['priority','Priority: high first'],['manual','Manual: my order']];

   const doneA=doneFor(a.task,a.day),doneB=doneFor(b.task,b.day);
   if(doneA!==doneB)return Number(doneA)-Number(doneB);
   const p=priorityRank(a.task)-priorityRank(b.task),due=(entryDate(a)||'9999-12-31').localeCompare(entryDate(b)||'9999-12-31');

function arrangePlanCards(grid){
 const cards=Array.from(grid.querySelectorAll(':scope > .section-card'));
 if(!cards.length)return;
 grid.replaceChildren();
 let lanes=null,left=null,right=null,ratio=[1,1];
 const flush=()=>{lanes=null;left=null;right=null;ratio=[1,1]};
 for(const card of cards){
   const mod=moduleById(card.dataset.moduleId),r=layoutRect(mod);
   if(r.w>=10){flush();card.classList.add('plan-wide');grid.append(card);continue}
   if(!lanes){lanes=document.createElement('div');lanes.className='plan-lanes';left=document.createElement('div');right=document.createElement('div');left.className='plan-column plan-left';right.className='plan-column plan-right';lanes.append(left,right);grid.append(lanes)}
   // Preserve the intended left/right placement, but allow each lane to stack freely.
   const isRight=r.x>=6||(r.x+r.w>8&&r.w<=5);
   (isRight?right:left).append(card);
   ratio[isRight?1:0]=Math.max(ratio[isRight?1:0],r.w);
   lanes.style.gridTemplateColumns=`minmax(0,${ratio[0]}fr) minmax(0,${ratio[1]}fr)`;
 }
}

/* Base64 transfer wrapper: obfuscation only, NOT encryption. No password needed. */
const TRANSFER_BASE64_HEADER='WLP-BASE64-V1';
function encodeTransferText(json){
 const bytes=new TextEncoder().encode(json);
 const chunks=[];
 for(let i=0;i<bytes.length;i+=16384){chunks.push(String.fromCharCode(...bytes.subarray(i,i+16384)))}
 const base64=btoa(chunks.join(''));
 const wrapped=base64.match(/.{1,120}/g)?.join('\n')||'';
 return TRANSFER_BASE64_HEADER+'\n'+wrapped+'\n';
}
function decodeTransferText(text){
 const trimmed=text.replace(/^\uFEFF/,'').trim();
 if(!trimmed.startsWith(TRANSFER_BASE64_HEADER))return trimmed; // Earlier plain-JSON backups still work.
 const match=/^WLP-BASE64-V1\s+([\s\S]*)$/.exec(trimmed);
 if(!match)throw Error('Invalid encoded planner backup header');
 const base64=match[1].replace(/\s/g,'');
 if(base64.length>42_000_000)throw Error('Encoded backup exceeds the safe import limit');
 if(base64.length%4!==0||!/^[A-Za-z0-9+/]*={0,2}$/.test(base64))throw Error('Invalid Base64 data in backup');
 let binary;
 try{binary=atob(base64)}catch(e){throw Error('Backup Base64 data is damaged or incomplete')}
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
 try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch(e){throw Error('Backup text is damaged or is not valid UTF-8')}
}
function exportFilename(){
 const bytes=new Uint8Array(3);
 if(globalThis.crypto?.getRandomValues){globalThis.crypto.getRandomValues(bytes)}
 else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);
 const suffix=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
 return `offline_planner_${isoDate()}-${suffix}.txt`;
}
function exportFile(){persist();const json=JSON.stringify({format:'work-life-planner-transfer',schema:1,exportedAt:now(),sourceDevice:deviceId,records:store.records,prefs:store.prefs});const output=encodeTransferText(json);downloadText(output,exportFilename());showToast('Base64 .txt exported · setup + all data')}

function importReportText(report){if(!report)return '';const label={task:'tasks',subtask:'subtasks',module:'layouts',note:'notes',other:'other records'};const rows=['task','subtask','module','note','other'].map(k=>`${label[k]}: ${report.added?.[k]||0} added / ${report.updated?.[k]||0} updated`);return (report.mode==='replace'?'Full restore':'Merge')+' · '+report.at+'\n'+rows.join('\n')+'\n'+report.unchanged+' unchanged, '+report.conflictRecords+' conflicting records ('+report.conflictFields+' fields), '+report.resolved+' resolved fields'}
function showImportReport(){if(!lastImportSummary){showToast('No import results available yet');return}const content=document.createElement('div');content.className='import-summary';const pre=document.createElement('pre');pre.style.cssText='white-space:pre-wrap;line-height:1.65;font:inherit';pre.textContent=importReportText(lastImportSummary);content.append(pre);const dlg=modal('Last import results','',[{label:'Close',css:'blue',run:close=>close()}]);dlg.body.append(content)}
function loadImport(event){const f=event.target.files?.[0];event.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const obj=readTransfer(String(fr.result));if(obj.kind==='legacy')return legacyImportDialog(obj.data);const d=obj.data;const stats=Object.values(d.records).reduce((o,r)=>(o[r.kind]=(o[r.kind]||0)+1,o),{});modal('Import planner transfer',`<p>This text file contains <b>${stats.task||0} tasks</b>, <b>${stats.subtask||0} subtasks</b>, <b>${stats.note||0} note records</b> and <b>${stats.module||0} section layouts</b>.</p><p class="backup-info">Exported: ${esc(d.exportedAt||'Unknown')}<br>Device: ${esc(d.sourceDevice||'Unknown')}</p><div class="notice ok">Recommended: <b>Merge</b> preserves entries from both devices and asks you to review simultaneous edits of the same field. A full replace discards any current local records not present in this file.</div>`,[{label:'Cancel',run:close=>close()},{label:'Merge changes',css:'blue',run:close=>{close();mergeTransfer(d)}},{label:'Replace local data…',run:close=>{close();confirmAction('Replace ALL local data?',`This will discard local entries that are not included in the imported file. Export the current planner first if you might need them.`,()=>replaceTransfer(d),'Replace everything')}}])}catch(err){modal('Import failed',`<p>${esc(err.message)}</p><p class="backup-info">No local data was changed.</p>`,[{label:'Close',run:c=>c()}])}};fr.readAsText(f)}
function isAncestor(maybeAncestor,latest){return latest.rev===maybeAncestor.rev||(latest.anc||[]).includes(maybeAncestor.rev)}
function mergeTransfer(transfer){if(storageRecoveryRequired&&!preserveDamagedDataForRestore())return;if(conflicts.length){showToast('Resolve existing merge conflicts before importing again');reviewConflicts();return}const incoming=transfer.records;const next=deepClone(store.records);const issues=[];const report=newImportStats('merge'),updatedRecords=new Set(),conflictRecords=new Set();let added=0,updated=0;for(const [id,remote] of Object.entries(incoming)){const local=next[id];if(!local){next[id]=deepClone(remote);added++;countImportKind(report.added,remote.kind);continue}if(local.kind!==remote.kind){issues.push({id,field:'kind',local:{value:local.kind,rev:'local',anc:[]},remote:{value:remote.kind,rev:'remote',anc:[]}});conflictRecords.add(id);continue}for(const [key,r] of Object.entries(remote.fields||{})){const l=local.fields[key];if(!l){local.fields[key]=deepClone(r);updated++;updatedRecords.add(id);continue}if(l.rev===r.rev)continue;if(isAncestor(l,r)){local.fields[key]=deepClone(r);updated++;updatedRecords.add(id);continue}if(isAncestor(r,l))continue;if(JSON.stringify(l.value)===JSON.stringify(r.value)){local.fields[key]={...l,anc:[...new Set([...l.anc,r.rev,...r.anc])].slice(0,240)};continue}issues.push({id,field:key,local:deepClone(l),remote:deepClone(r)});conflictRecords.add(id)}}
 for(const id of updatedRecords)countImportKind(report.updated,next[id]?.kind);
 report.conflictRecords=conflictRecords.size;report.conflictFields=issues.length;
 report.unchanged=Object.keys(incoming).filter(id=>store.records[id]&&!updatedRecords.has(id)&&!conflictRecords.has(id)).length;
 store.records=next;store.pendingConflicts=issues;for(const [view,pages] of Object.entries(transfer.prefs?.pages||{})){if(VIEW_NAMES[view]&&Array.isArray(pages))store.prefs.pages[view]=[...new Set([...(store.prefs.pages[view]||[1]),...pages.filter(p=>Number.isInteger(p)&&p>0&&p<=50)])].sort((a,b)=>a-b)} // Visible layout pages are unioned. Other preferences remain local.
 ensureDefaultModules();ensureSharedSettings();if(!issues.length)consolidateOldCarriedTasks();saveImportReport(report);persist();conflicts=issues;unresolvedCount=issues.length;render();if(issues.length){showToast(`Merged ${added} new record(s); ${issues.length} conflict(s) need review`);reviewConflicts()}else {showImportReport();showToast(`Merge completed · ${added} new record(s), ${updated} field update(s)`)} }
function replaceTransfer(transfer){if(storageRecoveryRequired&&!preserveDamagedDataForRestore())return;const rollback=deepClone(store);try{store.records=deepClone(transfer.records);store.prefs={...newStore().prefs,...deepClone(transfer.prefs||{})};store.prefs.pages={...deepClone(PAGE_ACTIVE_DEFAULT),...(store.prefs.pages||{})};ensureDefaultModules();ensureSharedSettings();consolidateOldCarriedTasks();persist();if(!storageOkay)throw Error('Unable to write local storage');conflicts=[];unresolvedCount=0;store.pendingConflicts=[];const report=newImportStats('replace');
 for(const record of Object.values(transfer.records))countImportKind(report.added,record.kind);
 saveImportReport(report);persist();render();showImportReport();showToast('Local planner replaced with imported backup')}catch(e){store=rollback;persist();modal('Restore failed',`<p>${esc(e.message)}</p>`,[{label:'Close',run:c=>c()}])}}
function resolveConflict(issue,useRemote){const obj=store.records[issue.id];if(!obj)return;if(issue.field==='kind'){if(useRemote)obj.kind=issue.remote.value;return}const chosen=useRemote?issue.remote:issue.local,other=useRemote?issue.local:issue.remote;const union=[chosen.rev,...chosen.anc,other.rev,...other.anc];obj.fields[issue.field]={value:deepClone(chosen.value),rev:`${deviceId}:${++seq}:${Date.now()}`,anc:[...new Set(union)].slice(0,240)};scheduleSave()}
function reviewConflicts(){if(!conflicts.length){unresolvedCount=0;render();return}const m=modal(`Review ${conflicts.length} merge conflict(s)`,`<p class="muted">Both devices changed the same field since their last shared version. Choose which value to retain for each conflict. Other changes have already been merged.</p><div id="conflict-items" class="conflicts-list"></div>`,[{label:'Keep selected values',css:'blue',run:close=>{const choices=Array.from(m.body.querySelectorAll('.conflict-item'));choices.forEach((item,i)=>resolveConflict(conflicts[i],item.querySelector('input[value=remote]').checked));if(lastImportSummary){lastImportSummary.resolved+=conflicts.length;saveImportReport(lastImportSummary)}conflicts=[];unresolvedCount=0;store.pendingConflicts=[];consolidateOldCarriedTasks();syncSharedPrefs();persist();close();render();showImportReport();showToast('Merge conflicts resolved')}}]);const dst=m.body.querySelector('#conflict-items');for(const [i,issue] of conflicts.entries()){const div=document.createElement('div');div.className='conflict-item';const obj=store.records[issue.id];const title=g(obj,'title')||g(obj,'text')||issue.id;div.innerHTML=`<b>${esc(title.slice(0,120))}</b><div class="backup-info">Field: ${esc(issue.field)}</div><div class="conflict-options"><label><input type="radio" name="conflict-${i}" value="local" checked><span><b>Keep this device</b><pre>${esc(JSON.stringify(issue.local.value,null,2).slice(0,1200))}</pre></span></label><label><input type="radio" name="conflict-${i}" value="remote"><span><b>Use imported version</b><pre>${esc(JSON.stringify(issue.remote.value,null,2).slice(0,1200))}</pre></span></label></div>`;dst.append(div)}}
function helpDialog(){modal("How to use Offline Planner",`<h3>Planning</h3><p>Dated tasks use one shared record across Daily, Weekly and Monthly. Tasks due within seven days are highlighted in Daily as Due soon. Priority and energy requirement are independent. The Anytime tab lists all tasks without deadlines, including Backlog. Use Select tasks to complete, archive, change category, priority, energy or due dates in batches. After importing, view an itemised report of added, updated, unchanged and conflicting records. Choose No due date to keep an anytime task visible on Daily without making it overdue; unscheduled backlog tasks remain in Backlog. Edit, complete, reschedule or archive a task from any view; changes sync across the views; unfinished dated tasks automatically remain visible in Daily on every subsequent day without changing their original due dates. Backlog tasks can be scheduled using the ↗ button. Old Carry Forward copies are consolidated by their recorded source IDs, not by matching task names.</p><h3 style="margin-top:14px">Subtasks / small steps</h3><p>Select <b>＋ Add subtasks</b> beneath any task, then type a step and press Enter or Add step. Tick steps individually, use ↑ and ↓ to reorder, or ✕ to remove one. The progress count is shown everywhere the task appears. Parent completion is independent. Repeating tasks remember completed steps separately for each date. Subtasks are included in printed pages and Base64 transfers.</p><h3 style="margin-top:14px">Editing your A4 layout</h3><p>Choose <b>Edit layout</b>. Select a section, drag it to move it, or use the blue lower-right handle to resize it. On your Pixel, the position and size number fields are easier for precise edits. Add sections and pages whenever needed. Hidden sections keep their content. All changes are included in backups.</p><h3 style="margin-top:14px">Phone ↔ laptop transfers</h3><p>1. Export .txt from the device you just edited. 2. Move the text file to your other device. 3. Import it on the other device and choose <b>Merge changes</b>. 4. Review any conflicting edits. Repeat in the opposite direction when you switch devices. Use Replace only for intentional full restores. Exported .txt files use Base64 text and are decoded automatically on import; this discourages casual reading but is not encryption. Earlier plain-JSON planner backups remain importable.</p><h3 style="margin-top:14px">Installing the HTML</h3><p>The application is a single offline HTML document. It can be renamed to a .txt file for ordinary file transport and renamed back to .html before opening in a compatible browser. Open the renamed HTML file in a compatible browser. The setup/data exports are already .txt, so no renaming is required for those.</p><div class="notice">Keep copies of your exported .txt files. Each browser saves its own data separately, and local browser storage can be cleared.</div>`,[{label:'Close',css:'blue',run:close=>close()}])}
function resetDialog(factory=false){
 const required=factory?'RESET':'CLEAR';
 const heading=factory?'Factory reset planner':'Clear all tasks and notes';
 const explanation=factory?
   'Erase all tasks, subtasks, notes, history, custom layouts and preferences on this device. Return to the default blank planner.':
   'Erase all tasks, subtasks, notes and history on this device, but keep your custom sections, layouts and view settings.';
 const m=modal(heading,`<p>${esc(explanation)}</p><div class="notice">This does not delete exported backups. Please export a backup first if you might need the information again. This will not automatically clear your other device.</div><div class="field"><label for="reset-confirm">Type <b>${required}</b> to confirm</label><input id="reset-confirm" autocomplete="off" placeholder="${required}"></div>`,[
  {label:'Cancel',run:close=>close()},
  {label:'Erase now',css:'blue',run:close=>{
    if(m.body.querySelector('#reset-confirm').value.trim()!==required){showToast('Type '+required+' exactly to confirm');return}
    if(storageRecoveryRequired&&!preserveDamagedDataForRestore())return;
    const previous=deepClone(store);
    if(factory){store=newStore();ensureDefaultModules();ensureSharedSettings()}
    else {for(const [id,record] of Object.entries(store.records)){if(['task','subtask','note','occurrence','suboccurrence'].includes(record.kind))delete store.records[id]}}
    store.pendingConflicts=[];conflicts=[];unresolvedCount=0;collapsedSubtasks.clear();openEmptySubtasks.clear();
    focusDates={daily:isoDate(),weekly:monday(isoDate()),monthly:monthOf(isoDate())};active='daily';mode='plan';
    persist();if(!storageOkay){store=previous;persist();showToast('Reset failed: local storage is unavailable');return}
    close();render();showToast(factory?'Planner restored to factory defaults':'Tasks and notes cleared · layouts kept');
  }}
 ]);
}
function settingsDialog(){const m=modal('Planner settings',`<div class="settings-grid"><label><input type="checkbox" id="s-done" ${store.prefs.showDone?'checked':''}> Show completed tasks</label><p class="backup-info">Unfinished overdue tasks always remain visible in Daily. Dates never shift automatically.</p><label><input type="checkbox" id="s-rules" ${store.prefs.showRules?'checked':''}> Show handwriting lines in empty print boxes</label></div><hr style="border:0;border-top:1px solid #e1e7ee;margin:17px 0"><h3>Data & device transfer</h3><p class="backup-info">Your changes are saved in this browser's local storage. That storage can be cleared, and different copies or file paths may have separate storage. Export a Base64 .txt file regularly. It is not encrypted, but it is not directly readable as plain JSON. Merge it after moving between devices; never rely on email or local storage as your only backup.</p><p class="backup-info">Offline · no fonts, scripts or tracking loaded from the internet · no account.</p><div class="page-tools" style="margin-top:12px"><button class="button" id="s-export">Export transfer .txt</button><button class="button" id="s-import">Import transfer .txt</button></div><hr style="border:0;border-top:1px solid #e1e7ee;margin:17px 0"><h3>Start fresh / reset</h3><p class="backup-info">These erase local data only. Export a backup before clearing if you may need it later.</p><div class="page-tools"><button class="button" id="s-clear">Clear tasks and notes (keep layout)</button><button class="button" id="s-factory">Factory reset everything</button></div>`,[{label:'Save settings',css:'blue',run:close=>{setPreference('showDone',m.body.querySelector('#s-done').checked);setPreference('showRules',m.body.querySelector('#s-rules').checked);close();render()}}]);m.body.querySelector('#s-export').onclick=exportFile;m.body.querySelector('#s-import').onclick=()=>document.querySelector('#file-import').click();m.body.querySelector('#s-clear').onclick=()=>resetDialog(false);m.body.querySelector('#s-factory').onclick=()=>resetDialog(true)}
/* Guided V4 migration: recover the original input ordering without trusting mutable DOM positions. */
function hashLegacy(data){let h=2166136261;const str=JSON.stringify(data);for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function convertLegacy(src){const v=src.inputs||[],c=src.checks||[];if(v.length<259||c.length<207)throw Error('This V4 backup is missing expected input fields');const extra=v.length-259;const mstart=v.length-64,mcstart=c.length-20;
 const dated=[];for(let i=0;i<20;i++){const ofs=i<10?mstart+1+i*3:mstart+33+(i-10)*3;dated.push({date:v[ofs]||'',category:['Work','Personal','Appt'].includes(v[ofs+1])?v[ofs+1]:'Work',text:v[ofs+2]||'',done:!!c[mcstart+i],section:i<10?'monthly-radar':'monthly-radar-extra'})}
 const dailyDate=parseDate(v[0])?v[0]:isoDate();const monthlyCountDate=dated.filter(d=>d.date===dailyDate&&d.text.trim()).length;const expectedDaily=monthlyCountDate||2;let candidate=null;
 for(let nd=1;nd<=extra-1;nd++){const nw=extra-nd;const weeklyIdx=153+nd;const wk=v[weeklyIdx];if(nd!==expectedDaily||!parseDate(wk)||nw<1)continue;const weekStart=monday(wk);const weekEnd=addDays(weekStart,6);const count=dated.filter(x=>x.date>=weekStart&&x.date<=weekEnd&&x.text.trim()).length;const expectedWeekly=count||2;if(nw===expectedWeekly){candidate={nd,nw,weekStart};break}}
 if(!candidate)throw Error('Cannot safely reconstruct the V4 field positions. The backup may already contain a shifted or corrupted layout. Import was stopped to avoid misplacing data.');
 const {nd,nw,weekStart}=candidate;const token=hashLegacy(src);const records={};const mk=(kind,id,values)=>{const fields={};for(const [key,value] of Object.entries(values))fields[key]={value,rev:`legacy:${token}:${id}:${key}`,anc:[]};records[id]={id,kind,fields}};
 const add=(section,scope,text,done,extraFields={},origIndex=0)=>{if(!String(text||'').trim())return;const id=`legacy-${token}-${section}-${scope}-${origIndex}`;mk('task',id,{section,scope,text:String(text),done:!!done,priority:'normal',due:'',category:'Work',recurrence:'none',startDate:scope.length===10?scope:'',created:now(),order:origIndex,deleted:false,...extraFields})};
 const note=(section,scope,text)=>{if(text)mk('note',noteId(section,scope),{module:section,scope,text:String(text)})};
 let ii=0,ci=0;ii++; // Original daily-date.
 ii+=nd;ci+=nd; // Auto-feeder copies, stored elsewhere in the monthly master.
 function taskGroup(section,scope,n){for(let i=0;i<n;i++)add(section,scope,v[ii++],c[ci++],{},i)}
 taskGroup('daily-nonneg',dailyDate,3);taskGroup('daily-work',dailyDate,5);taskGroup('daily-waiting',dailyDate,5);taskGroup('daily-appts',dailyDate,5);taskGroup('daily-personal',dailyDate,5);
 note('daily-scratch',dailyDate,v[ii++]);
 // Page 2 work has its own 3-line task entries, mapped into the main Work section.
 for(let i=0;i<4;i++)add('daily-work',dailyDate,v[ii++],c[ci++],{},5+i);
 note('daily-work-notes',dailyDate,v[ii++]);taskGroup('daily-personal-extra',dailyDate,6);note('daily-scratch-extra',dailyDate,v[ii++]);
 for(const [section,n] of [['backlog-work',14],['backlog-home',14],['backlog-tech',14],['backlog-someday',14],['backlog-work-extra',15],['backlog-home-extra',15],['backlog-tech-extra',15],['backlog-someday-extra',15]])taskGroup(section,'all',n);
 const weeklyInput=v[ii++];if(monday(weeklyInput)!==weekStart)throw Error('Weekly position mismatch: stopped safely');ii+=nw;ci+=nw;
 for(let day=0;day<6;day++){const taskDate=addDays(weekStart,day);for(let i=0;i<5;i++){const text=v[ii++],checked=c[ci++];add('weekly-days',taskDate,text,checked,{},day*5+i)}}
 taskGroup('weekly-priorities',weekStart,8);note('weekly-scratch',weekStart,v[ii++]);note('weekly-notes-extra',weekStart,v[ii++]);note('weekly-scratch-extra',weekStart,v[ii++]);
 const month=/^\d{4}-\d{2}$/.test(v[ii])?v[ii]:monthOf(isoDate());ii++;
 for(let j=0;j<10;j++){ii+=3;ci++}note('monthly-work-focus',month,v[ii++]);note('monthly-personal-focus',month,v[ii++]);for(let j=10;j<20;j++){ii+=3;ci++}note('monthly-scratch-extra',month,v[ii++]);
 for(let j=0;j<dated.length;j++){const x=dated[j];add(x.section,'all',x.text,x.done,{due:parseDate(x.date)?x.date:'',category:x.category},j)}
 if(ii!==v.length||ci!==c.length)throw Error(`V4 layout reconstruction mismatch (${ii}/${v.length} fields, ${ci}/${c.length} checks). Nothing was imported.`);
 return {format:'work-life-planner-transfer',schema:1,sourceDevice:'original-v4-'+token,exportedAt:now(),records,prefs:{pages:Object.fromEntries(Object.entries(src.p2Visible||{}).map(([k,v])=>[k,v?[1,2]:[1]]))},migration:{tasks:Object.values(records).filter(r=>r.kind==='task').length,notes:Object.values(records).filter(r=>r.kind==='note').length,dailyDate,weekStart}}}
function legacyImportDialog(legacy){let converted;try{converted=convertLegacy(legacy)}catch(e){modal('Original V4 import requires care',`<div class="notice">${esc(e.message)}</div><p>The original application saved fields by position, so an uncertain conversion could scramble tasks. No data was changed. Keep the original V4 backup and import from it only when its field mapping can be verified.</p>`,[{label:'Close',run:close=>close()}]);return}const m=converted.migration;modal('Import original planner (V4)',`<p>Recognised the original positional layout and prepared <b>${m.tasks} tasks</b> and <b>${m.notes} notes</b> for safe import.</p><p class="backup-info">Daily records date: ${esc(m.dailyDate)}<br>Weekly start: ${esc(m.weekStart)}<br>Existing new-format data will be merged, not cleared.</p><div class="notice">Important: the old application could already have shifted values before it saved. Check the imported records carefully. A shared Saturday/Sunday box becomes Saturday in this migration, since the original file did not distinguish the two days.</div>`,[{label:'Cancel',run:close=>close()},{label:'Merge recovered records',css:'blue',run:close=>{close();mergeTransfer(converted)}}])}
/* Service/UI wiring */
document.getElementById('backup-btn').onclick=exportFile;
document.getElementById('import-btn').onclick=()=>document.getElementById('file-import').click();
document.getElementById('file-import').onchange=loadImport;
document.getElementById('settings-btn').onclick=settingsDialog;document.getElementById('help-btn').onclick=helpDialog;
document.getElementById('preview-btn').onclick=previewDialog;
document.getElementById('mode-plan').onclick=()=>setMode('plan');
document.getElementById('mode-layout').onclick=()=>setMode('layout');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal-layer').children.length)document.getElementById('modal-layer').innerHTML=''});
window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist()});
window.addEventListener('beforeprint',()=>{if(!document.getElementById('print-root').children.length){const root=document.getElementById('print-root');root.append(buildMeasuredPaperSet(active))}});
load();render();
if(!storage.getItem('WORK_LIFE_OFFLINE_PLANNER_V1_SEEN_LEGACY')){try{if(storage.getItem(LEGACY_KEY)){const bar=document.createElement('div');bar.className='notice';bar.innerHTML='An original V4 planner was detected in this browser. <button class="button small" id="legacy-import-now">Review and import its data</button> <button class="button small" id="legacy-dismiss">Not now</button>';document.getElementById('notifications').append(bar);bar.querySelector('#legacy-import-now').onclick=()=>{try{legacyImportDialog(JSON.parse(storage.getItem(LEGACY_KEY)))}catch(e){showToast('Unable to read previous planner data')}};bar.querySelector('#legacy-dismiss').onclick=()=>{storage.setItem('WORK_LIFE_OFFLINE_PLANNER_V1_SEEN_LEGACY','1');bar.remove()}}}catch(e){}}
</script>
